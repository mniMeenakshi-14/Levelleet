<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Levelleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="app">
  <header class="hud" id="hud"></header>
  <main id="map"></main>
</div>
<section id="play" hidden aria-label="Level"></section>
<section id="notebook" hidden aria-label="Rough work notebook"></section>
<section id="lesson" hidden aria-label="Animated lesson"></section>
<section id="auth" class="auth" hidden aria-label="Account"></section>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
  // Leave empty when the Java server serves this page (http://localhost:8080).
  // If you open the frontend from another place (Live Server, file://, GitHub Pages),
  // set it to the backend address, for example 'http://localhost:8080'.
  window.LEVELLEET_API_BASE = '';
</script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
</body>
</html>
