spring.application.name=levelleet
server.port=8080

# ---- MySQL ----
# Change the user and password, or set DB_USER and DB_PASSWORD as environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/levelleet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# update = create missing tables/columns automatically. Use "validate" if you run database/schema.sql yourself.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Levelleet ----
# Days a login stays valid
levelleet.token-days=30
# Highest allowed level index (the map has 54 levels today; leave room to grow)
levelleet.max-levels=1000
# Which websites may call the API from another address. Use your real site in production.
levelleet.cors.allowed-origins=*
